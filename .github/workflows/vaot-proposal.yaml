name: Marketplace VAOT Proposal

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4.0.2
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  checks:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, test-unit, test-integration]
        include:
          - check: format
            command: pnpm format:check
          - check: lint
            command: pnpm lint:check
          - check: test-unit
            command: pnpm test:unit
          - check: test-integration
            command: pnpm test:integration
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4.0.2
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install Lua dependencies
        if: matrix.check == 'lint' || matrix.check == 'test-unit'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl libreadline-dev
          bash ./scripts/install-lua-deps.sh
          sudo luarocks install --deps-only ar-io-marketplace-process-0.1.0-1.rockspec
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  propose:
    runs-on: ubuntu-latest
    needs: checks
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4.0.2
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pnpm propose-eval
        env:
          WALLET: ${{ secrets.WALLET }}
          MARKETPLACE_PROCESS_ID: ${{ vars.MARKETPLACE_PROCESS_ID }}
          VAOT_ID: ${{ vars.VAOT_ID }}

      - name: Notify Success
        if: success()
        uses: rtCamp/action-slack-notify@v2.3.0
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Marketplace Process Eval Proposed!
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CUSTOM_PAYLOAD: |
            {
              "attachments": [{
                "fallback": "Marketplace Process Eval Proposed!",
                "color": "good",
                "title": "Details",
                "text": "The Marketplace ${{ github.ref_name == 'main' && 'Testnet' || 'Devnet' }} Process has an Eval update Proposal!",
                "fields": [{
                  "title": "Network",
                  "value": "${{ github.ref_name == 'main' && 'testnet' || 'devnet' }}",
                  "short": true
                },
                {
                  "title": "Process ID",
                  "value": "${{ vars.MARKETPLACE_PROCESS_ID }}",
                  "short": true
                },
                {
                  "title": "View on scan.ar.io",
                  "value": "https://scan.ar.io/#/entity/${{ vars.MARKETPLACE_PROCESS_ID }}?tab=source-code",
                  "short": false
                },
                {
                  "title": "Vote on this proposal in VAOT",
                  "value": "https://vaot.ar.io/#/${{ vars.VAOT_ID }}",
                  "short": false
                },
                {
                  "title": "Commit",
                  "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                }
                ]
              }]
            }

      - name: Notify Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: danger
          SLACK_TITLE: Marketplace Process Eval Proposal FAILED!
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CUSTOM_PAYLOAD: |
            {
              "text": "Marketplace Process Eval Proposal Failed!",
              "attachments": [{
                "fallback": "Failed to propose Eval update to Marketplace Process!",
                "color": "danger",
                "title": "Details",
                "text": "The Marketplace ${{ github.ref_name == 'main' && 'Testnet' || 'Devnet' }} Process FAILED to create an Eval update Proposal!",
                "fields": [{
                  "title": "Network",
                  "value": "${{ github.ref_name == 'main' && 'testnet' || 'devnet' }}",
                  "short": true
                },
                {
                  "title": "Process ID",
                  "value": "${{ vars.MARKETPLACE_PROCESS_ID }}",
                  "short": true
                },
                {
                  "title": "GitHub Action",
                  "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "short": false
                },
                {
                  "title": "Commit",
                  "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                }
                ]
              }]
            }
